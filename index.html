<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill of Lading Generator</title>
<style>
  :root { --navy: #23320A; --green: #A2D241; --cream: #EFE9E2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; }
  .tabs { display: flex; background: var(--navy); }
  .tabs button {
    flex: 1; padding: 14px 16px; border: none; cursor: pointer;
    background: var(--navy); color: #fff; font-size: 15px; font-weight: bold;
    border-bottom: 4px solid transparent;
  }
  .tabs button.active { background: var(--cream); color: var(--navy); border-bottom-color: var(--green); }
  .tabs button:hover { opacity: 0.9; }
  iframe { display: none; width: 100%; height: 100vh; border: none; }
  iframe.active { display: block; }
  @media print { .tabs { display: none; } }
</style>
</head>
<body>
<div class="tabs">
  <button class="active" data-target="chike" onclick="showTab('chike')">Chike Custom</button>
  <button data-target="vics" onclick="showTab('vics')">VICS Standard (Walmart)</button>
</div>
<iframe id="chike" class="active" src="chike.html" title="Chike Custom BOL"></iframe>
<iframe id="vics" src="vics.html" title="VICS Standard BOL"></iframe>
<script>
  function showTab(name) {
    document.querySelectorAll('iframe').forEach(f => f.classList.toggle('active', f.id === name));
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.target === name));
  }
  // Size each frame to its content so the page scrolls normally (same-origin only)
  function fit(frame) {
    try {
      const h = frame.contentDocument.documentElement.scrollHeight;
      if (h > 0) frame.style.height = h + 'px';
    } catch (e) { frame.style.height = '1200px'; }
  }
  document.querySelectorAll('iframe').forEach(f => f.addEventListener('load', () => fit(f)));
</script>
</body>
</html>
